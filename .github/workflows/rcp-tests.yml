name: Validar RCP

on:
  push:
    branches: [main]
    paths:
      - index.html
      - tests/rcp.test.cjs
      - .github/workflows/rcp-tests.yml
  pull_request:
    paths:
      - index.html
      - tests/rcp.test.cjs
      - .github/workflows/rcp-tests.yml

permissions:
  contents: read

jobs:
  rcp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/rcp.test.cjs
